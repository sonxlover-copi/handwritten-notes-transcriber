<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Конспект в PDF</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #202124; background: #f5f6f8; }
      body { max-width: 900px; margin: 40px auto; padding: 0 20px; }
      h1 { margin-bottom: 8px; }
      .hint { color: #5f6368; line-height: 1.5; }
      .panel { background: white; border: 1px solid #dfe1e5; border-radius: 12px; padding: 20px; margin-top: 20px; }
      .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
      button { border: 0; border-radius: 8px; padding: 10px 16px; color: white; background: #2457c5; cursor: pointer; }
      button:disabled { opacity: .55; cursor: wait; }
      textarea { box-sizing: border-box; width: 100%; min-height: 360px; margin-top: 16px; padding: 14px; border: 1px solid #dfe1e5; border-radius: 8px; font: 15px/1.55 ui-monospace, monospace; }
      #status { min-height: 24px; margin-top: 12px; color: #5f6368; }
      #status.error { color: #b3261e; }
      #copy { background: #4b5563; }
    </style>
  </head>
  <body>
    <h1>Конспект в PDF</h1>
    <p class="hint">Загрузите фото или скан. Приложение распознает текст, оформит заголовки, списки и формулы в LaTeX и соберёт PDF. Неразборчивые места будут помечены.</p>

    <section class="panel">
      <form id="form" class="row">
        <input id="file" name="file" type="file" accept=".png,.jpg,.jpeg,.webp,.pdf" required>
        <button id="submit" type="submit">Распознать и скачать PDF</button>
        <button id="pdf" type="button" disabled>Скачать PDF ещё раз</button>
        <button id="tex" type="button" disabled>Скачать LaTeX</button>
      </form>
      <div id="status" role="status"></div>
      <textarea id="result" placeholder="Здесь появится структурированная расшифровка. Сверьте её с оригиналом."></textarea>
    </section>

    <script>
      const form = document.querySelector("#form");
      const fileInput = document.querySelector("#file");
      const submitButton = document.querySelector("#submit");
      const result = document.querySelector("#result");
      const status = document.querySelector("#status");
      const pdfButton = document.querySelector("#pdf");
      const texButton = document.querySelector("#tex");
      let transcribedDocument = null;
      let latexSource = "";

      async function downloadPdf() {
        const response = await fetch("/pdf", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(transcribedDocument),
        });
        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.detail || "Не удалось собрать PDF.");
        }

        const url = URL.createObjectURL(await response.blob());
        const link = document.createElement("a");
        const baseName = transcribedDocument.filename.replace(/\.[^.]+$/, "") || "конспект";
        link.href = url;
        link.download = `${baseName}.pdf`;
        link.click();
        URL.revokeObjectURL(url);
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!fileInput.files.length) return;

        submitButton.disabled = true;
        status.classList.remove("error");
        status.textContent = "Распознаю страницы и собираю документ…";
        result.value = "";
        pdfButton.disabled = true;
        texButton.disabled = true;
        transcribedDocument = null;
        latexSource = "";

        try {
          const body = new FormData();
          body.append("file", fileInput.files[0]);
          const response = await fetch("/transcribe", { method: "POST", body });
          const data = await response.json();
          if (!response.ok) throw new Error(data.detail || "Не удалось обработать файл.");

          transcribedDocument = data.document;
          latexSource = data.latex_source;
          result.value = data.preview;
          status.textContent = "Текст распознан. Компилирую LaTeX в PDF…";
          await downloadPdf();
          pdfButton.disabled = false;
          texButton.disabled = false;
          status.textContent = `Готово: ${transcribedDocument.pages.length} стр. PDF скачан; проверьте расшифровку по оригиналу.`;
        } catch (error) {
          status.classList.add("error");
          status.textContent = error.message;
        } finally {
          submitButton.disabled = false;
        }
      });

      pdfButton.addEventListener("click", async () => {
        try {
          await downloadPdf();
          status.classList.remove("error");
          status.textContent = "PDF скачан повторно.";
        } catch (error) {
          status.classList.add("error");
          status.textContent = error.message;
        }
      });

      texButton.addEventListener("click", () => {
        const url = URL.createObjectURL(new Blob([latexSource], { type: "application/x-tex" }));
        const link = document.createElement("a");
        link.href = url;
        link.download = "конспект.tex";
        link.click();
        URL.revokeObjectURL(url);
      });
    </script>
  </body>
</html>

services:
  ollama:
    image: ollama/ollama:latest
    container_name: local-rag-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    restart: unless-stopped

  api:
    build: .
    container_name: local-rag-api
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data/docs:/app/data/docs:ro
      - chroma_data:/app/data/chroma
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
  chroma_data:

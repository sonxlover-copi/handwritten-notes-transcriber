services:
  ollama:
    image: ollama/ollama:latest
    container_name: notes-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    restart: unless-stopped

  app:
    build: .
    container_name: notes-transcriber
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      VISION_MODEL: ${VISION_MODEL:-qwen3-vl:8b}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-20}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
